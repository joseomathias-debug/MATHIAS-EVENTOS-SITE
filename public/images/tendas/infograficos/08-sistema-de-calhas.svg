<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" viewBox="0 0 1000 1400" role="img" aria-labelledby="title desc">
  <title id="title">Sistema de calhas para tendas conjugadas</title><desc id="desc">Ilustração técnica com duas tendas reais conjugadas, calha cinza na união, descida fixada ao lado do pé e comparação entre montagem com e sem calha.</desc><defs>
  <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#E7E8E1"/></linearGradient>
  <linearGradient id="canvas-side" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ECEDE7"/><stop offset="1" stop-color="#D6D8D1"/></linearGradient>
  <filter id="shadow" x="-15%" y="-15%" width="130%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="11" flood-color="#10110E" flood-opacity=".10"/></filter>
  <filter id="tent-shadow" x="-20%" y="-20%" width="140%" height="160%"><feGaussianBlur stdDeviation="7"/></filter>
  <marker id="water-arrow" markerWidth="18" markerHeight="18" refX="16" refY="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L18 9L0 18Z" fill="#F4C900"/></marker>
</defs><style>
  text{font-family:"Montserrat","Inter","Segoe UI",Arial,sans-serif}
  .eyebrow{font-size:17px;font-weight:800;letter-spacing:2.4px}
  .title{font-size:54px;font-weight:850;letter-spacing:-1.8px}
  .area{font-size:30px;font-weight:850}
  .config{font-size:21px;font-weight:850;letter-spacing:.7px}
  .quantity{font-size:42px;font-weight:850;letter-spacing:-.8px}
  .capacity{font-size:29px;font-weight:750}
  .dimension{font-size:18px;font-weight:600}
  .note{font-size:17px;font-weight:550}
  .structure{fill:none;stroke:#858982;stroke-width:3.6;stroke-linecap:square;stroke-linejoin:miter;vector-effect:non-scaling-stroke}
  .fine{fill:none;stroke:#A8AAA3;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
</style>
  <g id="fundo" inkscape:groupmode="layer" inkscape:label="Fundo"><rect width="1000" height="1400" fill="#F7F7F2"/></g>
  <g id="cabecalho" inkscape:groupmode="layer" inkscape:label="Cabeçalho"><rect width="1000" height="180" fill="#10110E"/><g transform="translate(42 30)" aria-label="Mathias Eventos"><g transform="scale(.12)"><path d="M48 52H272M84 52V82M160 52V82M236 52V82" fill="none" stroke="#F4C900" stroke-width="16"/><path d="M58 218L84 82H236L262 218M84 82L122 124L160 82L198 124L236 82M160 82V218M48 218H92M228 218H272" fill="none" stroke="#F7F7F2" stroke-width="15"/></g><text x="48" y="24" fill="#F7F7F2" font-size="16" font-weight="800" letter-spacing="2.8">MATHIAS EVENTOS</text></g><text x="42" y="113" fill="#F7F7F2" class="title">SISTEMA DE CALHAS</text><text x="42" y="153" fill="#A8AAA3" class="dimension">Água captada na união e conduzida pela lateral da estrutura.</text></g>
  <g id="tendas-conjugadas" inkscape:groupmode="layer" inkscape:label="Duas tendas conjugadas">
    <rect x="28" y="210" width="944" height="760" rx="28" fill="#FFFFFF" stroke="#D8DAD3" filter="url(#shadow)"/>
    <ellipse cx="500" cy="844" rx="418" ry="44" fill="#10110E" opacity=".09"/>
    <path d="M82 468L284 292L488 468Z" fill="url(#canvas)" stroke="#858982" stroke-width="4"/>
    <path d="M512 468L714 292L918 468Z" fill="url(#canvas)" stroke="#858982" stroke-width="4"/>
    <path d="M82 468H488V505H82ZM512 468H918V505H512Z" fill="#F7F7F2" stroke="#858982" stroke-width="4"/>
    <path d="M284 292V468M714 292V468" class="fine"/>
    <path d="M100 505V846M470 505V846M530 505V846M900 505V846" class="structure"/>
    <path d="M100 505L154 560M470 505L416 560M530 505L584 560M900 505L846 560" class="fine"/>
    <path d="M100 505H470M530 505H900" class="structure"/>
  </g>
  <g id="calha-cinza" inkscape:groupmode="layer" inkscape:label="Calha cinza e descida lateral">
    <path d="M482 462Q500 490 518 462L512 528Q500 544 488 528Z" fill="#858982" stroke="#10110E" stroke-width="3"/>
    <path d="M488 350L500 463L512 350" fill="none" stroke="#858982" stroke-width="12" stroke-linecap="round"/>
    <path d="M518 520H538V834H518Z" fill="#858982" stroke="#10110E" stroke-width="3"/>
    <path d="M512 548H544M512 690H544M512 810H544" stroke="#858982" stroke-width="9"/>
    <path d="M278 342C350 375 415 414 473 456" fill="none" stroke="#F4C900" stroke-width="7" marker-end="url(#water-arrow)"/>
    <path d="M720 342C650 375 586 414 526 456" fill="none" stroke="#F4C900" stroke-width="7" marker-end="url(#water-arrow)"/>
    <path d="M500 376V500" fill="none" stroke="#F4C900" stroke-width="7" marker-end="url(#water-arrow)"/>
    <path d="M548 556V800" fill="none" stroke="#F4C900" stroke-width="7" marker-end="url(#water-arrow)"/>
    <path d="M548 834C548 875 595 884 640 884" fill="none" stroke="#F4C900" stroke-width="7" marker-end="url(#water-arrow)"/>
    <g transform="translate(590 535)"><rect width="290" height="47" rx="23" fill="#10110E"/><text x="145" y="30" text-anchor="middle" fill="#F7F7F2" font-size="16" font-weight="800">DESCIDA FIXADA AO LADO DO PÉ</text></g>
  </g>
  <g id="detalhe-ampliado" inkscape:groupmode="layer" inkscape:label="Detalhe ampliado da calha">
    <circle cx="820" cy="330" r="116" fill="#FFFFFF" stroke="#F4C900" stroke-width="7" filter="url(#shadow)"/>
    <text x="820" y="256" text-anchor="middle" fill="#10110E" class="eyebrow">DETALHE</text>
    <path d="M748 306L804 340M892 306L836 340" stroke="#858982" stroke-width="11" stroke-linecap="square"/>
    <path d="M800 337Q820 374 840 337" fill="none" stroke="#858982" stroke-width="15" stroke-linecap="round"/>
    <path d="M820 349V405" fill="none" stroke="#F4C900" stroke-width="7" marker-end="url(#water-arrow)"/>
  </g>
  <g id="comparacao" inkscape:groupmode="layer" inkscape:label="Comparação sem e com calha">
    <g transform="translate(30 1000)"><rect width="450" height="150" rx="24" fill="#ECEDE7"/><text x="30" y="48" fill="#62655F" class="eyebrow">SEM CALHA</text><path d="M30 65H420" stroke="#A8AAA3" stroke-width="2"/><text x="30" y="108" fill="#62655F" class="capacity">água cai na união</text><path d="M390 75V126" stroke="#A8AAA3" stroke-width="7" stroke-dasharray="7 9"/></g>
    <g transform="translate(520 1000)"><rect width="450" height="150" rx="24" fill="#10110E"/><text x="30" y="48" fill="#F4C900" class="eyebrow">COM CALHA</text><path d="M30 65H420" stroke="#F4C900" stroke-width="2"/><text x="30" y="108" fill="#F7F7F2" class="capacity">fluxo captado e conduzido</text></g>
  </g>
  <g id="texto-tecnico" inkscape:groupmode="layer" inkscape:label="Texto técnico"><text x="40" y="1215" fill="#10110E" class="capacity">A calha cinza acompanha a união das coberturas.</text><text x="40" y="1260" fill="#62655F" class="dimension">A água é direcionada até a descida instalada ao lado do pé estrutural,</text><text x="40" y="1294" fill="#62655F" class="dimension">sem adicionar uma barra no centro da estrutura.</text><circle cx="47" cy="1350" r="7" fill="#F4C900"/><text x="67" y="1357" fill="#62655F" class="note">Esquema ilustrativo. A montagem final depende da configuração das tendas e do local.</text></g>
</svg>